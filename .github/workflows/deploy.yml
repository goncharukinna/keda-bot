name: Build and Deploy keda-bot

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем код бота
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Логинимся в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Собираем и пушим образ с тегом, равным SHA коммита
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/keda-bot:${{ github.sha }}

      # 4. Обновляем тег в GitOps-репозитории
      - name: Update GitOps Repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Клонируем репозиторий bots-gitops, используя токен для авторизации
          git clone https://$DOCKER_USERNAME:$GITOPS_TOKEN@github.com/goncharukinna/bots-gitops.git
          cd bots-gitops
          
          # Меняем старый тег на новый SHA в файле deployment.yaml
          sed -i "s|image: .*keda-bot:.*|image: $DOCKER_USERNAME/keda-bot:$IMAGE_TAG|" manifests/keda-bot/deployment.yaml
          
          # Настраиваем Git и коммитим
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add manifests/keda-bot/deployment.yaml
          git commit -m "ci: update keda-bot image tag to $IMAGE_TAG [skip ci]"
          git push origin main
